<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Therapist Image Tool</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f1ea}#app{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="app" src="app.html" allow="clipboard-read; clipboard-write"></iframe>
<script>
const STAND_BACKGROUND_PROMPT=`STAND BACKGROUND CHANGE ONLY — ABSOLUTE WOMAN / POSE / SCALE PRESERVATION

BASE IMAGE = the STAND image generated immediately before this message in this same chat.
BACKGROUND REFERENCE = the background image attached to THIS message.

Change ONLY the background of the BASE IMAGE.
Use the attached BACKGROUND REFERENCE only for the background environment.
Do NOT regenerate, redesign, reinterpret, or beautify the woman.

ABSOLUTELY PRESERVE FROM THE BASE IMAGE:
- exact facial identity and facial structure
- face size and head-to-body ratio
- skin appearance and skin tone
- hairstyle, hair color, hair length, and hair volume
- exact body shape and all body proportions
- apparent height
- bust size, shoulder width, ribcage width, waist size, hip width, and hip shape
- torso length, arm length, thigh length, lower-leg length, total leg length, and leg-to-torso ratio
- outfit, outfit fit, garment length, color, material, and decorative details
- high heels, platform, straps, toe shape, heel shape, and heel-height impression
- exact standing pose
- torso orientation
- head orientation
- arm, hand, finger, leg, knee, foot, and heel placement
- weight distribution
- subject scale inside the frame
- apparent head size
- camera-to-subject distance
- camera height
- focal-length / perspective impression
- framing and full-body composition
- lighting on the woman, exposure character, white balance, and shadows as consistently as possible

BACKGROUND REFERENCE LOCK:
Reproduce the attached background reference as faithfully as possible.
The final background must remain the same simple white sheer-curtain environment with the pale floor visible only along the bottom.
Preserve the curtain-to-floor boundary at approximately the same vertical position as the reference image.
The curtain should occupy approximately 90% of the image height and the floor approximately the lower 10%.
DO NOT enlarge or extend the visible floor area.
DO NOT raise or lower the curtain-to-floor boundary merely to fit the woman.
DO NOT add furniture, walls, windows, decor, props, rugs, shadows, architectural details, or other objects that are not present in the background reference.
DO NOT redesign the background.

SUBJECT SCALE + PLACEMENT LOCK:
The woman must remain at the BASE IMAGE'S existing photographic scale and position as closely as possible.
Do NOT zoom in or zoom out.
Do NOT shrink the woman to make the background fit.
Do NOT enlarge the woman to fill empty space.
Do NOT lengthen the legs or alter anatomy to fit the new floor position.
Do NOT move the camera backward or forward.
Empty space is acceptable.
Adapt ONLY the background behind the already-established woman.

FIXED FORMAT:
Keep VERTICAL 3:4.
Keep the entire woman visible from the complete top of the head and all hair to the complete high heels, soles, heel tips, and shoe tips.
Do not crop any body part.

FINAL RULE:
The result must look like THE SAME BASE WOMAN in THE SAME POSE, SAME BODY, SAME PROPORTIONS, SAME OUTFIT, SAME HIGH HEELS, SAME SCALE, SAME CAMERA DISTANCE, and SAME FRAMING — with ONLY the background replaced by the attached fixed STAND background.

The necessary background reference is attached to this message. Execute the background edit now.`;

function patchStandFacePrompt(w){
  w.standFaceInstruction=function(s){
    const side=s.bodySide==='left'?'left':'right';
    const sideUpper=side.toUpperCase();
    const imageSide=side==='left'?'image-left':'image-right';
    const oppositeSide=side==='left'?'right':'left';

    if(s.faceAngle==='same'){
      return `FINAL HEAD + FACE ORIENTATION — CRITICAL: Keep the head and face naturally aligned with the torso's FINAL ${sideUpper} direction. Do NOT add any extra neck rotation beyond the torso direction. Do NOT turn the face back toward the camera. Do NOT create an over-the-shoulder look. The nose and gaze must follow the torso direction. Keep the neck upright and do not tilt the head.`;
    }

    if(s.faceAngle==='90'){
      return `FINAL HEAD + FACE ORIENTATION — CRITICAL: Set the face to a TRUE ${sideUpper} SIDE PROFILE. Use the camera/viewer as the fixed reference. The FINAL face orientation is 90 degrees from front-facing. The nose must point clearly toward ${imageSide}. Do NOT turn the face toward the viewer. Do NOT create an over-the-shoulder look. Do NOT make eye contact with the camera. Keep the neck upright and do not tilt the head.`;
    }

    const rearAmount=Number(s.faceAngle)||30;
    const finalFromFront=90+rearAmount;
    return `FINAL HEAD + FACE ORIENTATION — CRITICAL:\n\nSet the head and face to ${sideUpper}-REAR ${rearAmount} DEGREES FROM A TRUE ${sideUpper} PROFILE.\n\nUse a TRUE 90-DEGREE ${sideUpper} SIDE PROFILE as the reference position. From that true side-profile position, rotate the face an ADDITIONAL ${rearAmount} degrees AWAY FROM THE CAMERA toward the rear.\n\nTherefore, the FINAL face orientation is approximately ${finalFromFront} degrees from front-facing.\n\nThis is NOT ${rearAmount} degrees from front-facing.\nThis is NOT the same direction as a ${rearAmount}-degree torso orientation.\nThis is NOT a turn back toward the camera.\n\nFrom the camera viewpoint:\n- the face must be more rear-facing than a pure ${side} profile\n- only a limited portion of the facial features should remain visible\n- the nose must point strongly toward ${imageSide} and away from the viewer\n- the gaze must follow the same ${side}-rear direction\n- the ${oppositeSide} side of the face must become substantially less visible\n- NO eye contact with the camera\n- NO front-facing or camera-facing three-quarter face\n- NO look-back pose\n- NO over-the-shoulder pose\n\nKeep the neck upright and anatomically natural. Do not tilt the head.`;
  };
}

function patch(){
  const f=document.getElementById('app');
  const w=f.contentWindow,d=f.contentDocument;
  if(!d||!d.body)return;

  patchStandFacePrompt(w);

  const dl=[...d.querySelectorAll('nav button')].find(b=>b.textContent.trim()==='DOWNLOAD');
  if(dl)dl.remove();
  const downloadPage=d.getElementById('download');
  if(downloadPage)downloadPage.remove();

  if(!d.getElementById('stand-v24-style')){
    const s=d.createElement('style');
    s.id='stand-v24-style';
    s.textContent='.stand-builder-link-v24{cursor:pointer;transition:border-color .16s ease,box-shadow .16s ease,transform .16s ease}.stand-builder-link-v24:hover{border-color:#B79A63!important;box-shadow:0 0 0 2px rgba(183,154,99,.12)!important}.stand-builder-link-v24:active{transform:translateY(1px)}.stand-builder-link-v24:focus-visible{outline:2px solid #B79A63;outline-offset:3px}.stand-background-actions-v24{margin-top:9px}.stand-background-actions-v24 button{min-height:42px}';
    d.head.appendChild(s);
  }

  const preview=d.getElementById('preview-stand');
  if(preview&&!preview.dataset.v24){
    preview.dataset.v24='1';
    preview.classList.add('stand-builder-link-v24');
    preview.setAttribute('role','button');
    preview.setAttribute('tabindex','0');
    preview.setAttribute('aria-label','STANDポーズ設定ページを開く');
    preview.addEventListener('click',()=>w.showPage('standing'));
    preview.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();w.showPage('standing')}});

    const card=preview.closest('.pose-main-card');
    if(card){
      card.classList.add('stand-home-card-v24');
      const old=[...card.querySelectorAll('button')].find(b=>b.textContent.trim()==='ポーズ設定');
      if(old)old.remove();
      const actions=d.createElement('div');
      actions.className='pose-inline-actions-v16 stand-background-actions-v24';
      const bgBtn=d.createElement('button');
      bgBtn.className='pose-register-btn';
      bgBtn.textContent='背景画像';
      bgBtn.addEventListener('click',e=>{e.stopPropagation();w.copyStandFixedBackground()});
      const promptBtn=d.createElement('button');
      promptBtn.className='pose-image-copy';
      promptBtn.textContent='背景プロンプト';
      promptBtn.addEventListener('click',e=>{e.stopPropagation();w.copyLiteral(STAND_BACKGROUND_PROMPT,'背景変更プロンプトをコピーしました')});
      actions.append(bgBtn,promptBtn);
      preview.insertAdjacentElement('afterend',actions);

      const img=d.createElement('img');
      img.id='stand-fixed-background-v24';
      img.alt='STAND fixed background';
      img.src='stand-bg.jpg';
      img.style.display='none';
      card.appendChild(img);
    }
  }

  w.STAND_BACKGROUND_PROMPT=STAND_BACKGROUND_PROMPT;
  w.copyStandFixedBackground=function(){
    const img=d.getElementById('stand-fixed-background-v24');
    if(!img||!img.src){w.toast('背景画像を取得できませんでした');return}
    w.copyImageElement(img);
  };
}

document.getElementById('app').addEventListener('load',()=>{try{patch()}catch(e){console.error(e)}});
</script>
</body>
</html>
